<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Remove noindex at launch (M8), only after the owner approves indexing. -->
    <meta name="robots" content="noindex" />
    <title>Ifreet Zareef Hossain — Research &amp; Engineering Portfolio</title>
    <meta name="description" content="Ifreet Zareef Hossain, B.Sc. Computer Science and Engineering student at American International University-Bangladesh (AIUB). Conference research work, projects and skills in machine learning, AI in healthcare and biomedical monitoring." />
    <meta name="author" content="Ifreet Zareef Hossain" />
    <meta name="theme-color" content="#FBFAF7" />
    <!-- Apply the saved (or system) colour theme before first paint to avoid a flash.
         Keep the key and colours in sync with src/hooks/useTheme.ts. -->
    <script>
      (function () {
        var theme
        try {
          theme = localStorage.getItem('theme')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        var root = document.documentElement
        root.dataset.theme = theme
        root.style.colorScheme = theme
        if (theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0A1020')
      })()
    </script>
    <link rel="canonical" href="https://zareef-hossain.github.io/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The hero portrait is the largest above-the-fold image; start fetching it before JS runs. -->
    <link rel="preload" as="image" href="/images/profile.jpg" fetchpriority="high" />
    <!-- Latin subsets of the two web fonts, fetched alongside the JS instead of after the CSS
         is parsed (reduces font-swap layout shift). Vite rewrites these to the hashed files that
         the @fontsource CSS requests; preloaded fonts need crossorigin even on the same origin. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource-variable/source-serif-4/files/source-serif-4-latin-opsz-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2" />

    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Ifreet Zareef Hossain" />
    <meta property="og:title" content="Ifreet Zareef Hossain — Research &amp; Engineering Portfolio" />
    <meta property="og:description" content="Computer Science and Engineering student at AIUB exploring machine learning, biomedical systems, and AI for real-world applications." />
    <meta property="og:url" content="https://zareef-hossain.github.io/" />
    <meta property="og:image" content="https://zareef-hossain.github.io/images/profile.jpg" />
    <meta property="og:image:width" content="800" />
    <meta property="og:image:height" content="1005" />
    <meta property="og:image:alt" content="Portrait of Ifreet Zareef Hossain" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
